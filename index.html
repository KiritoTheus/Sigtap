<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SIGTAPP">
    <link rel="apple-touch-icon" href="icon.png">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGTAP Pro - Matheus George</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19; 
            --card: #172033; 
            --accent: #60a5fa; 
            --cyan: #38bdf8;
            --text: #f1f5f9; 
            --text-dim: #94a3b8; 
            --border: rgba(148, 163, 184, 0.12);
            --opme: #34d399; 
            --proc: #fbbf24; 
            --danger: #f87171;
            --sidebar-width: 260px;
        }
        
        body { 
            background: var(--bg); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            color: var(--text); 
            padding-bottom: 40px; 
            display: flex;
            min-height: 100vh;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #splash-screen .splash-logo {
            max-width: 240px; width: 70%; height: auto; margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        #splash-screen .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.8; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }

        /* Sidebar Lateral */
        aside {
            width: var(--sidebar-width);
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .sidebar-brand {
            padding: 24px 20px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand span { color: var(--accent); }
        
        .sidebar-menu {
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .nav-item i { font-size: 1rem; width: 20px; text-align: center; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }
        .nav-item.active { background: rgba(96, 165, 250, 0.12); color: var(--accent); }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .btn-upload {
            width: 100%;
            background: rgba(96, 165, 250, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-upload:hover { background: var(--accent); color: #fff; }

        /* Área de Conteúdo Principal */
        wrapper {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 24px;
            max-width: calc(100vw - var(--sidebar-width));
            box-sizing: border-box;
        }

        #st {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.15);
            color: var(--cyan);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            display: inline-block;
        }

        /* Componentes de Busca e Listagem */
        .search-container { max-width: 850px; margin-bottom: 24px; position: relative; }
        .search-box {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        
        #results {
            position: absolute; width: 100%; top: 60px;
            background: var(--card); border-radius: 14px; border: 1px solid var(--border);
            max-height: 380px; overflow-y: auto; z-index: 2000; display: none;
            box-shadow: 0 16px 36px rgba(0,0,0,0.4);
        }
        .item {
            padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer;
            transition: background 0.15s;
        }
        .item:hover { background: rgba(255, 255, 255, 0.02); }
        .item:last-child { border-bottom: none; }

        /* Cards e Layout de Visualização */
        .container { max-width: 1000px; display: none; }
        .hero-card {
            background: var(--card); border-radius: 16px; padding: 24px;
            border: 1px solid var(--border); margin-bottom: 24px; position: relative;
        }
        .fav-icon-btn {
            position: absolute; top: 24px; right: 24px;
            background: rgba(255,255,255,0.05); border: none;
            color: var(--text-dim); width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
        }
        .fav-icon-btn.active { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        .grid-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
        @media (min-width: 640px) { .grid-stats { grid-template-columns: repeat(5, 1fr); } }
        
        .stat-box { 
            background: rgba(255,255,255,0.02); padding: 12px; 
            border-radius: 12px; border: 1px solid var(--border); text-align: center; 
        }
        .stat-box small { display: block; font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
        .stat-box b { color: var(--cyan); font-size: 0.95rem; }
        
        .price-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
        @media (min-width: 640px) { .price-row { grid-template-columns: repeat(4, 1fr); } }
        .price-tag { background: rgba(255,255,255,0.01); padding: 14px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .price-tag b { font-size: 1.05rem; }
        .price-tag.total { background: rgba(96, 165, 250, 0.08); border: 1px solid rgba(96, 165, 250, 0.2); color: var(--accent); }
        
        /* Abas Internas */
        .nav-tabs { 
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; 
            scrollbar-width: none; margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-dim); cursor: pointer; white-space: nowrap;
            font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--accent); color: #0b0f19; font-weight: 700; border-color: var(--accent); }
        .tab-content { display: none; animation: fadeIn 0.25s ease-out; }
        
        /* Listagem de Cards */
        .card-list { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 14px; padding: 16px; margin-bottom: 12px; 
            position: relative; overflow: hidden; transition: transform 0.2s;
        }
        .card-list:hover { transform: translateY(-2px); }
        .badge { font-size: 0.6rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; color: #fff; text-transform: uppercase; display: inline-block; }
        .badge-opme { background: rgba(52, 211, 153, 0.2); color: var(--opme); border: 1px solid var(--opme); }
        .badge-proc { background: rgba(251, 191, 36, 0.2); color: var(--proc); border: 1px solid var(--proc); }
        .badge-excl { background: rgba(248, 113, 113, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        .view-section { display: none; max-width: 1000px; }
        .view-section.active { display: block; }

        /* Botão Flutuante de Voltar */
        #btn-back {
            position: fixed; bottom: 30px; right: 30px; z-index: 999;
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--accent); color: #0b0f19; border: none;
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
            display: none; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: all 0.2s;
        }
        #btn-back:hover { transform: scale(1.05); }

        /* Responsividade para telas pequenas */
        @media (max-width: 768px) {
            aside { transform: translateX(-100%); }
            aside.mobile-open { transform: translateX(0); }
            wrapper { margin-left: 0; max-width: 100vw; padding: 16px; }
            .menu-toggle { display: block !important; }
        }

        .menu-toggle {
            display: none; background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 10px 14px; border-radius: 10px;
            cursor: pointer; margin-bottom: 16px; font-size: 1rem;
        }
    </style>
</head>
<body>

<div id="splash-screen">
    <img src="logo.png" alt="Matheus George" class="splash-logo">
    <div class="spinner"></div>
    <p style="margin-top: 25px; font-size: 0.75rem; color: var(--text-dim); letter-spacing: 1.5px; font-weight: 600;">CARREGANDO SISTEMA</p>
</div>

<aside id="sidebar">
    <div class="sidebar-brand">
        MATHEUS<span>SIGTAP</span>
    </div>
    <div class="sidebar-menu">
        <div class="nav-item active" onclick="navigate(event, 'view-search')">
            <i class="fa-solid fa-magnifying-glass"></i>Busca Geral
        </div>
        <div class="nav-item" onclick="navigate(event, 'view-procedimentos')">
            <i class="fa-solid fa-list-check"></i>Procedimentos
        </div>
        <div class="nav-item" onclick="navigate(event, 'view-opme')">
            <i class="fa-solid fa-boxes-stacked"></i>Listagem OPME
        </div>
        <div class="nav-item" onclick="navigate(event, 'view-favorites')">
            <i class="fa-solid fa-star"></i>Meus Favoritos
        </div>
    </div>
    <div class="sidebar-footer">
        <button class="btn-upload" onclick="document.getElementById('file').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>Subir Arquivo ZIP
        </button>
        <input type="file" id="file" style="display:none">
    </div>
</aside>

<wrapper>
    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
    
    <div id="st">CONECTANDO AO BANCO...</div>

    <section id="view-search" class="view-section active">
        <div class="search-container">
            <input type="text" id="sin" class="search-box" placeholder="Pesquisar código ou nome do procedimento..." disabled>
            <div id="results"></div>
        </div>
    </section>

    <section id="view-procedimentos" class="view-section">
        <div class="search-container">
            <input type="text" class="search-box" placeholder="Filtrar nesta lista..." oninput="filterLocalList(this.value, 'list-procs-data', false)">
        </div>
        <div id="list-procs-data"></div>
    </section>

    <section id="view-opme" class="view-section">
        <div class="search-container">
            <input type="text" class="search-box" placeholder="Filtrar nesta lista..." oninput="filterLocalList(this.value, 'list-opme-data', true)">
        </div>
        <div id="list-opme-data"></div>
    </section>

    <section id="view-favorites" class="view-section">
        <h3 style="margin-top: 0; font-weight: 700; color: var(--text-dim);">Procedimentos Favoritados</h3>
        <div id="list-favorites-data"></div>
    </section>

    <main class="container" id="ui">
        <div class="hero-card">
            <button id="fav-btn" class="fav-icon-btn" onclick="toggleFavoriteCurrent()"><i class="fa-solid fa-star"></i></button>
            <h1 id="ui-n" style="margin:0 45px 15px 0; font-size:1.3rem; font-weight: 700; line-height: 1.3;"></h1>
            
            <div class="grid-stats">
                <div class="stat-box" style="border-color: rgba(56, 189, 248, 0.3); background: rgba(56, 189, 248, 0.02);">
                    <small>Código</small>
                    <b id="st-cod" style="font-family: monospace; font-size: 0.95rem;"></b>
                </div>
                <div class="stat-box"><small>Qtd Max</small><b id="st-q"></b></div>
                <div class="stat-box"><small>Permanência</small><b id="st-p"></b></div>
                <div class="stat-box"><small>Idade</small><b id="st-i"></b></div>
                <div class="stat-box"><small>Gênero</small><b id="st-s"></b></div>
            </div>
            
            <div class="price-row">
                <div class="price-tag"><small style="display:block; font-size:0.65rem; color:var(--text-dim); margin-bottom:4px; font-weight:700;">SA</small><b id="v-sa"></b></div>
                <div class="price-tag"><small style="display:block; font-size:0.65rem; color:var(--text-dim); margin-bottom:4px; font-weight:700;">SH</small><b id="v-sh"></b></div>
                <div class="price-tag"><small style="display:block; font-size:0.65rem; color:var(--text-dim); margin-bottom:4px; font-weight:700;">SP</small><b id="v-sp"></b></div>
                <div class="price-tag total"><small style="display:block; font-size:0.65rem; margin-bottom:4px; font-weight:800;">TOTAL</small><b id="v-tt"></b></div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="tab(event, 'tab-mat')"><i class="fa-solid fa-layer-group"></i> Compatíveis/Excludentes</button>
            <button class="tab-btn" onclick="tab(event, 'tab-det')"><i class="fa-solid fa-tags"></i> Atributos</button>
            <button class="tab-btn" onclick="tab(event, 'tab-cid')"><i class="fa-solid fa-stethoscope"></i> CIDs</button>
            <button class="tab-btn" onclick="tab(event, 'tab-cbo')"><i class="fa-solid fa-user-md"></i> CBOs Permitidos</button>
            <button class="tab-btn" onclick="tab(event, 'tab-desc')"><i class="fa-solid fa-align-left"></i> Descrição</button>
            <button class="tab-btn" onclick="tab(event, 'tab-leito')"><i class="fa-solid fa-bed"></i> Leitos</button>
            <button class="tab-btn" onclick="tab(event, 'tab-serv')"><i class="fa-solid fa-hospital-user"></i> Serviços/Classif.</button>
            <button class="tab-btn" onclick="tab(event, 'tab-hab')"><i class="fa-solid fa-certificate"></i> Habilitações</button>
        </div>

        <div id="tab-mat" class="tab-content" style="display:block;"></div>
        <div id="tab-det" class="tab-content"></div>
        <div id="tab-cid" class="tab-content"></div>
        <div id="tab-desc" class="tab-content"><div id="ui-desc" style="padding:15px; color:var(--text-dim); line-height: 1.5; font-size: 0.9rem;"></div></div>
        <div id="tab-cbo" class="tab-content"></div>
        <div id="tab-leito" class="tab-content"></div>
        <div id="tab-serv" class="tab-content"></div>
        <div id="tab-hab" class="tab-content"></div>
    </main>
</wrapper>

<button id="btn-back" onclick="backToHome()">
    <i class="fa-solid fa-arrow-left"></i>
</button>

<script>
const normalizar = (str) => 
    str.normalize("NFD")
       .replace(/[\u0300-\u036f]/g, "")
       .toLowerCase();

function cumpreFiltro(textoAlvo, termoBusca) {
    if (!termoBusca) return false;
    const alvo = normalizar(textoAlvo);
    const palavrasBusca = normalizar(termoBusca).split(/\s+/).filter(p => p.length > 0);
    return palavrasBusca.every(palavra => alvo.includes(palavra));
}

const NOMES_LEITOS = {
    "01": "CIRURGICO", "02": "OBSTETRICO", "03": "PEDIATRICO", 
    "04": "TISSIOLOGIA", "05": "PSIQUIATRIA", "06": "CRONICOS", 
    "07": "CLINICO", "08": "HOSPITAL DIA"
};

let db;
let DATA = { 
    pList: [], pMap: {}, desc: {}, dets: {}, cids: {}, cbos: {}, 
    relCbo: {}, relLeito: {}, servicos: {}, classificacoes: {}, relServ: {}, 
    registros: {}, relReg: {}, relDet: {}, relCid: {}, relMat: {}, 
    habilitacoes: {}, relHab: {} 
};

let favoritos = JSON.parse(localStorage.getItem('theus_favs')) || [];
let currentCodeOpen = "";

const dec = new TextDecoder('iso-8859-1');
const startTime = Date.now();

const req = indexedDB.open("MATHEUS_FINAL_V2", 1);
req.onupgradeneeded = e => {
    const d = e.target.result;
    if (!d.objectStoreNames.contains("data")) d.createObjectStore("data");
};
req.onsuccess = e => {
    db = e.target.result;
    db.transaction("data").objectStore("data").get("current").onsuccess = ev => {
        if(ev.target.result) { 
            DATA = ev.target.result; 
        }
        unlock();
    };
};

function unlock() { 
    document.getElementById('sin').disabled = false; 
    document.getElementById('st').innerText = "BASE CARREGADA COM SUCESSO"; 
    
    const elapsedTime = Date.now() - startTime;
    const minimumDisplay = 4000; 
    const remainingTime = Math.max(0, minimumDisplay - elapsedTime);

    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 500);
        }
    }, remainingTime);
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
}

function navigate(e, sectionId) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.sidebar-menu .nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('ui').style.display = 'none';
    document.getElementById('btn-back').style.display = 'none';
    
    document.getElementById(sectionId).classList.add('active');
    if (e) e.currentTarget.classList.add('active');

    if(sectionId === 'view-procedimentos') renderFullList('list-procs-data', false);
    if(sectionId === 'view-opme') renderFullList('list-opme-data', true);
    if(sectionId === 'view-favorites') renderFavoritesList();
}

function backToHome() {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('btn-back').style.display = 'none';
    const activeNav = document.querySelector('.sidebar-menu .nav-item.active');
    if(activeNav) {
        const clickAttr = activeNav.getAttribute('onclick');
        const match = clickAttr.match(/'([^']+)'/);
        if(match) document.getElementById(match[1]).classList.add('active');
    }
}

function renderFullList(containerId, onlyOPME) {
    const container = document.getElementById(containerId);
    const list = DATA.pList.filter(p => onlyOPME ? p.c.startsWith('07') : !p.c.startsWith('07'));
    
    container.innerHTML = list.slice(0, 100).map(p => `
        <div class="card-list" onclick="show('${p.c}')" style="cursor:pointer; border-left:4px solid ${onlyOPME ? 'var(--opme)' : 'var(--proc)'}">
            <b style="color:var(--cyan); font-family: monospace;">${p.c}</b><br>
            <small style="display:block; margin-top:4px; font-weight:500;">${p.n}</small>
        </div>
    `).join('');
}

function filterLocalList(val, containerId, onlyOPME) {
    const q = val;
    const container = document.getElementById(containerId);
    if(q.length < 3) { renderFullList(containerId, onlyOPME); return; }

    const filtered = DATA.pList.filter(p => {
        const isType = onlyOPME ? p.c.startsWith('07') : !p.c.startsWith('07');
        return isType && (p.c.includes(q) || cumpreFiltro(p.n, q));
    }).slice(0, 50);

    container.innerHTML = filtered.map(p => `
        <div class="card-list" onclick="show('${p.c}')" style="cursor:pointer; border-left:4px solid ${onlyOPME ? 'var(--opme)' : 'var(--proc)'}">
            <b style="color:var(--cyan); font-family: monospace;">${p.c}</b><br>
            <small style="display:block; margin-top:4px; font-weight:500;">${p.n}</small>
        </div>
    `).join('') || "<p style='padding:20px; opacity:0.5; font-size:0.9rem;'>Nenhum resultado encontrado.</p>";
}

/* Gestão de Favoritos */
function toggleFavoriteCurrent() {
    const idx = favoritos.indexOf(currentCodeOpen);
    const btn = document.getElementById('fav-btn');
    if(idx > -1) {
        favoritos.splice(idx, 1);
        btn.classList.remove('active');
    } else {
        favoritos.push(currentCodeOpen);
        btn.classList.add('active');
    }
    localStorage.setItem('theus_favs', JSON.stringify(favoritos));
}

function renderFavoritesList() {
    const container = document.getElementById('list-favorites-data');
    if(!favoritos.length) {
        container.innerHTML = "<p style='padding:20px; opacity:0.5; font-size:0.9rem;'>Nenhum procedimento favoritado ainda.</p>";
        return;
    }
    
    container.innerHTML = favoritos.map(cod => {
        const p = DATA.pMap[cod];
        if(!p) return '';
        const isOPME = p.c.startsWith('07');
        return `
            <div class="card-list" onclick="show('${p.c}')" style="cursor:pointer; border-left:4px solid ${isOPME ? 'var(--opme)' : 'var(--proc)'}">
                <b style="color:var(--cyan); font-family: monospace;">${p.c}</b><br>
                <small style="display:block; margin-top:4px; font-weight:500;">${p.n}</small>
            </div>
        `;
    }).join('');
}

document.getElementById('file').onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    document.getElementById('st').innerText = "PROCESSANDO ARQUIVOS DA COMPETÊNCIA...";
    DATA = { 
        pList: [], pMap: {}, desc: {}, dets: {}, cids: {}, cbos: {}, 
        relCbo: {}, relLeito: {}, servicos: {}, classificacoes: {}, relServ: {}, 
        registros: {}, relReg: {}, relDet: {}, relCid: {}, relMat: {}, 
        habilitacoes: {}, relHab: {} 
    };
    const zip = await JSZip.loadAsync(file);
    const parse = async (name, cb) => {
        const f = zip.file(name); if(!f) return;
        const text = dec.decode(await f.async("arraybuffer"));
        text.split('\n').forEach(cb);
    };

    await parse("tb_procedimento.txt", l => {
        if(l.length >= 318) {
            const i = {
                c: l.substring(0, 10).trim(), n: l.substring(10, 260).trim(), sex: l.substring(261, 262).trim(),
                qmx: l.substring(262, 266).trim(), prm: l.substring(266, 270).trim(),
                iMi: l.substring(274, 278).trim(), iMa: l.substring(278, 282).trim(),
                sh: l.substring(282, 294).trim(), sa: l.substring(294, 306).trim(), sp: l.substring(306, 318).trim()
            };
            DATA.pList.push(i); DATA.pMap[i.c] = i;
        }
    });

    await parse("tb_descricao.txt", l => DATA.desc[l.substring(0,10).trim()] = l.substring(10).trim());
    await parse("tb_detalhe.txt", l => DATA.dets[l.substring(0,3).trim()] = l.substring(3,103).trim());
    await parse("tb_cid.txt", l => DATA.cids[l.substring(0,4).trim()] = l.substring(4,104).trim());
    await parse("rl_procedimento_detalhe.txt", l => {
        const p = l.substring(0,10).trim(), d = l.substring(10,13).trim();
        if(!DATA.relDet[p]) DATA.relDet[p] = []; DATA.relDet[p].push(d);
    });
    await parse("rl_procedimento_cid.txt", l => {
        const p = l.substring(0,10).trim(), c = l.substring(10,14).trim();
        if(!DATA.relCid[p]) DATA.relCid[p] = []; DATA.relCid[p].push(c);
    });
    await parse("rl_procedimento_compativel.txt", l => {
        if(l.length >= 29) {
            const p1 = l.substring(0, 10).trim(), p2 = l.substring(12, 22).trim(), tipo = l.substring(24, 25).trim(), qtd = l.substring(26, 29).trim(); 
            if(p1 && p2) {
                if(!DATA.relMat[p1]) DATA.relMat[p1] = []; DATA.relMat[p1].push({c: p2, t: tipo, q: qtd});
                if(!DATA.relMat[p2]) DATA.relMat[p2] = []; DATA.relMat[p2].push({c: p1, t: tipo, q: qtd});
            }
        }
    });
    await parse("tb_ocupacao.txt", l => {
        const cod = l.substring(0, 6).trim();
        if(cod) DATA.cbos[cod] = l.substring(6, 156).trim();
    });
    await parse("rl_procedimento_ocupacao.txt", l => {
        const p = l.substring(0, 10).trim(), c = l.substring(10, 16).trim();
        if(p && c && !DATA.relCbo[p]?.includes(c)) { if(!DATA.relCbo[p]) DATA.relCbo[p] = []; DATA.relCbo[p].push(c); }
    });
    await parse("rl_procedimento_leito.txt", l => {
        const p = l.substring(0, 10).trim(), leito = l.substring(10, 12).trim();
        if(p && leito && !DATA.relLeito[p]?.includes(leito)) { if(!DATA.relLeito[p]) DATA.relLeito[p] = []; DATA.relLeito[p].push(leito); }
    });
    await parse("tb_servico.txt", l => {
        const cod = l.substring(0, 3).trim();
        if(cod) DATA.servicos[cod] = l.substring(3, 123).trim();
    });
    await parse("tb_servico_classificacao.txt", l => {
        const s = l.substring(0, 3).trim(), c = l.substring(3, 6).trim();
        if(s && c) DATA.classificacoes[s + c] = l.substring(6, 156).trim();
    });
    await parse("rl_procedimento_servico.txt", l => {
        const p = l.substring(0, 10).trim(), s = l.substring(10, 13).trim(), c = l.substring(13, 16).trim();
        if(p && s && !DATA.relServ[p]?.find(x => x.s === s && x.c === c)) { if(!DATA.relServ[p]) DATA.relServ[p] = []; DATA.relServ[p].push({s, c}); }
    });
    await parse("tb_habilitacao.txt", l => {
        const cod = l.substring(0, 4).trim();
        if(cod) DATA.habilitacoes[cod] = l.substring(4, 154).trim();
    });
    await parse("rl_procedimento_habilitacao.txt", l => {
        const p = l.substring(0, 10).trim(), h = l.substring(10, 14).trim();
        if(p && h && !DATA.relHab[p]?.includes(h)) { if(!DATA.relHab[p]) DATA.relHab[p] = []; DATA.relHab[p].push(h); }
    });
    await parse("tb_registro.txt", l => {
        const cod = l.substring(0, 2).trim();
        if(cod) DATA.registros[cod] = l.substring(2, 52).trim();
    });
    await parse("rl_procedimento_registro.txt", l => {
        const p = l.substring(0, 10).trim(), r = l.substring(10, 12).trim();
        if(p && r && !DATA.relReg[p]?.includes(r)) { if(!DATA.relReg[p]) DATA.relReg[p] = []; DATA.relReg[p].push(r); }
    });
    if(db) {
        const tx = db.transaction("data", "readwrite");
        tx.objectStore("data").put(DATA, "current");
        tx.oncomplete = () => { unlock(); alert("Competência atualizada!"); };
    }
};

document.getElementById('sin').oninput = function() {
    const q = this.value;
    const res = document.getElementById('results');
    
    if(q.length < 3) { 
        res.style.display = 'none'; 
        return; 
    }

    const procs = DATA.pList.filter(p => 
        p.c.includes(q) || cumpreFiltro(p.n, q)
    ).slice(0, 10);

    const cidsEncontrados = Object.keys(DATA.cids)
        .filter(key => key.includes(q.toUpperCase()) || cumpreFiltro(DATA.cids[key], q))
        .slice(0, 5);

    let html = '';

    html += cidsEncontrados.map(c => `
        <div class="item" onclick="buscarProcedimentosPorCID('${c}')" style="border-left: 4px solid var(--cyan); background: rgba(56, 189, 248, 0.03);">
            <span class="badge" style="background:var(--cyan); color:#0b0f19;">CID</span> <b style="font-family: monospace;">${c}</b><br>
            <small style="display:block; margin-top:4px; color:var(--text-dim);">${DATA.cids[c]}</small>
        </div>
    `).join('');

    html += procs.map(m => `
        <div class="item" onclick="show('${m.c}')">
            <span class="badge badge-proc">PROC</span> <b style="font-family: monospace;">${m.c}</b><br>
            <small style="display:block; margin-top:4px; color:var(--text-dim);">${m.n}</small>
        </div>
    `).join('');

    res.innerHTML = html || "<div class='item' style='opacity:0.5; font-size:0.9rem;'>Nenhum resultado encontrado</div>";
    res.style.display = 'block';
};

function show(cod) {
    const p = DATA.pMap[cod];
    if (!p) return;

    currentCodeOpen = cod;
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.getElementById('results').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    document.getElementById('btn-back').style.display = 'flex';

    // Estado do botão de favorito
    const favBtn = document.getElementById('fav-btn');
    if(favoritos.includes(cod)) {
        favBtn.classList.add('active');
    } else {
        favBtn.classList.remove('active');
    }

    document.getElementById('st-cod').innerText = p.c;
    document.getElementById('ui-n').innerText = p.n;
    
    document.getElementById('st-q').innerText = p.qmx == "9999" ? "Ilimit." : p.qmx;
    document.getElementById('st-p').innerText = p.prm + " dias";
    document.getElementById('st-i').innerText = `${Math.floor(p.iMi/12)}-${Math.floor(p.iMa/12)}a`;
    document.getElementById('st-s').innerText = p.sex == 'M' ? 'Masc' : p.sex == 'F' ? 'Fem' : 'Ambos';

    document.getElementById('v-sa').innerText = fmt(p.sa);
    document.getElementById('v-sh').innerText = fmt(p.sh);
    document.getElementById('v-sp').innerText = fmt(p.sp);
    document.getElementById('v-tt').innerText = fmt(parseInt(p.sh) + parseInt(p.sp));

    let regHtml = '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;">';
    if (DATA.relReg[cod]) {
        DATA.relReg[cod].forEach(r => {
            const nome = DATA.registros[r] || 'Reg. ' + r;
            regHtml += `<span style="background:rgba(52, 211, 153, 0.12); color:var(--opme); border:1px solid rgba(52, 211, 153, 0.3); padding:5px 12px; border-radius:8px; font-size:0.7rem; font-weight:bold; display:inline-flex; align-items:center; gap:6px;"><i class="fa-solid fa-file-invoice"></i> ${nome}</span>`;
        });
    }
    regHtml += '</div>';
    document.getElementById('ui-desc').innerHTML = `<div style="margin-bottom:8px; line-height:1.5;">${DATA.desc[cod] || "Sem descrição cadastrada."}</div>${regHtml}`;

    const fill = (id, list, fn) => {
        const box = document.getElementById(id);
        if(box) box.innerHTML = (list && list.length) ? list.map(fn).join('') : "<p style='padding:20px; opacity:0.5; font-size:0.9rem;'>Sem dados associados.</p>";
    };

    const b = document.getElementById('tab-mat');
    let list = DATA.relMat ? DATA.relMat[cod] || [] : [];
    const uniqueMap = new Map();
    list.forEach(item => {
        const isExcl = (item.t === "3" || item.t === "4" || item.c === "0415020034");
        if (!uniqueMap.has(item.c) || isExcl) uniqueMap.set(item.c, item);
    });

    b.innerHTML = Array.from(uniqueMap.values()).map(m => {
        const info = DATA.pMap[m.c];
        const isExcl = (m.t === "3" || m.t === "4" || m.c === "0415020034"); 
        const isOPME = m.c.startsWith('07');
        let color = isExcl ? 'var(--danger)' : (isOPME ? 'var(--opme)' : 'var(--proc)');
        let label = isExcl ? 'EXCLUDENTE' : (isOPME ? 'OPME' : 'COMPATÍVEL');
        let badgeClass = isExcl ? 'badge-excl' : (isOPME ? 'badge-opme' : 'badge-proc');
        const quantidade = m.q !== undefined ? parseInt(m.q) : '--';

        return `<div class="card-list" style="border-left: 4px solid ${color}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span class="badge ${badgeClass}">${label}</span>
                    <span style="font-size: 0.75rem; font-weight: 700; margin-left: 10px; color: var(--text-dim);">QTD: ${quantidade}</span>
                </div>
                <b style="color:var(--cyan); font-family:monospace;">${m.c}</b>
            </div>
            <div style="font-weight:600; font-size:0.85rem; margin:10px 0; line-height:1.4;">${info ? info.n : 'Procedimento não mapeado no sistema'}</div>
            <div style="text-align:right; font-size:0.8rem; font-weight:bold; color:${color}">
                ${isExcl ? 'BLOQUEIA PRINCIPAL' : (info ? 'SH: ' + fmt(info.sh) : '--')}
            </div>
        </div>`;
    }).join('') || "<p style='padding:20px; opacity:0.5; font-size:0.9rem;'>Nenhuma relação de compatibilidade encontrada.</p>";

    fill('tab-det', DATA.relDet[cod], d => `<div class="card-list"><b style="color:var(--accent); font-family:monospace;">${d}</b> - ${DATA.dets[d] || 'Detalhe'}</div>`);
    fill('tab-cid', DATA.relCid[cod], c => `<div class="card-list"><b style="color:var(--cyan); font-family:monospace;">${c}</b> - ${DATA.cids[c] || 'CID'}</div>`);
    fill('tab-cbo', DATA.relCbo[cod], c => `<div class="card-list" style="border-left:4px solid var(--accent)"><b style="color:var(--accent); font-family:monospace;">${c}</b> - ${DATA.cbos[c] || 'CBO'}</div>`);
    fill('tab-leito', DATA.relLeito[cod], l => `<div class="card-list"><b style="color:var(--text);">${NOMES_LEITOS[l] || 'Leito '+l}</b></div>`);
    fill('tab-serv', DATA.relServ[cod], x => `<div class="card-list"><b style="color:var(--text);">${x.s} - ${DATA.servicos[x.s] || 'Serviço'}</b><br><small style="color:var(--text-dim); display:block; margin-top:4px;">${x.c} - ${DATA.classificacoes[x.s+x.c] || 'Classificação'}</small></div>`);
    fill('tab-hab', DATA.relHab[cod], h => `<div class="card-list"><b style="color:var(--proc); font-family:monospace;">${h}</b> - ${DATA.habilitacoes[h] || 'Habilitação'}</div>`);

    window.scrollTo({top: 0, behavior: 'smooth'});
}

function fmt(v) { return (parseInt(v)/100 || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function tab(e, id) {
    document.querySelectorAll('.tab-content').forEach(x => x.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.currentTarget.classList.add('active');
}

function buscarProcedimentosPorCID(codCID) {
    const res = document.getElementById('results');
    const input = document.getElementById('sin');
    
    const listaProcs = DATA.pList.filter(p => (DATA.relCid[p.c] || []).includes(codCID));
    input.value = codCID;
    
    let htmlHeader = `
        <div style="padding:14px; background:var(--card); border-bottom:2px solid var(--cyan); position:sticky; top:0; z-index:10;">
            <small style="color:var(--cyan); font-weight:800; font-size:0.65rem; text-transform:uppercase;">Procedimentos Relacionados ao CID:</small><br>
            <b style="font-size:0.95rem;">${codCID} - ${DATA.cids[codCID]}</b>
        </div>
    `;

    let htmlItens = listaProcs.map(m => `
        <div class="item" onclick="show('${m.c}')">
            <span class="badge badge-proc">PROC</span> <b style="font-family: monospace;">${m.c}</b><br>
            <small style="display:block; margin-top:4px; color:var(--text-dim);">${m.n}</small>
        </div>
    `).join('');

    res.innerHTML = htmlHeader + (htmlItens || "<div class='item' style='opacity:0.5; font-size:0.9rem;'>Nenhum procedimento compatível encontrado.</div>");
    res.style.display = 'block';
}
</script>
</body>
</html>
